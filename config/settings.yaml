# ANIMEDEX settings (05, spec v1.2).
# Values in <angle brackets> are placeholders. Offline work (mock provider, tests, builds) runs
# without them; live runs refuse to start until they are filled (G1a). Secrets go in .env only.
# `uv run animedex smoke` lists exactly what is still missing.

providers:
  # G1a 2026-09-26: every model call goes through Kingsley's subscriptions via the official CLIs in
  # headless mode (no model API keys). Each call runs from an empty scratch dir with an allowlisted
  # environment (no ANTHROPIC_*/OPENAI_*/CLAUDE*/CODEX_* variables), tools off, the pass prompt as
  # the system prompt. `uv run animedex smoke --providers` makes one tiny call per CLI and reports
  # the login method and anything user-level that still loads.
  claude_cli:
    type: claude_cli
    binary: claude
    send_params: [effort]
    timeout_s: 900
  codex_cli:                    # the non-Claude family for CHECK and the ideation judge
    type: codex_cli
    binary: codex
    send_params: [effort]
    timeout_s: 900
  # API-billed profiles below are kept for reference; no model slot uses them.
  openai_compatible:            # any OpenAI-compatible API: OpenRouter, vLLM, LM Studio, hosted
    type: openai_compatible
    base_url_env: OPENAI_COMPATIBLE_BASE_URL
    api_key_env: OPENAI_COMPATIBLE_API_KEY
    structured_output: json_schema   # json_schema | json_object | prompt
    send_params: [max_tokens]
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    fallbacks: default               # server-side refusal fallbacks; set to null to disable
    send_params: [max_tokens, effort]
  local:                        # local OpenAI-compatible endpoint (Ollama, LM Studio); the embeddings fallback
    type: openai_compatible
    base_url: http://localhost:11434/v1
    structured_output: json_object
    send_params: [max_tokens, temperature]
  polymath_embedder:            # Polymath's embedder sidecar: Qwen3-Embedding-0.6B, full precision, Mac GPU (MPS).
    type: polymath_embedder     # Embeddings only. Requests carry no priority header, so they run at background
    base_url: http://127.0.0.1:8742   # priority and never pre-empt Polymath's own work.
  mock:
    type: mock

models:   # G1a, approved 2026-09-26; routed to subscription CLIs 2026-09-26. Concrete ids, not aliases,
          # so a moved alias cannot change the model. `strict_model`: any other served model is refused.
  p1:              {provider: claude_cli, model: claude-sonnet-5, params: {effort: high}}
  verify:          {provider: claude_cli, model: claude-sonnet-5, params: {effort: high}}
  gather:          {provider: claude_cli, model: claude-haiku-4-5-20251001}   # v1.7 GATHER: web facts on the cheapest plan model
  interpret:       {provider: claude_cli, model: claude-opus-5-5, params: {effort: medium}}   # v1.7 INTERPRET (owner: Opus, effort medium)
  p2:              {provider: claude_cli, model: claude-opus-5-5, params: {effort: high}}
  p3:              {provider: claude_cli, model: claude-opus-5-5, params: {effort: high}}
  check:           {provider: codex_cli, model: gpt-5.6-terra, strict_model: true}   # owner: an older model is enough
  p4:              {provider: claude_cli, model: claude-haiku-4-5-20251001}
  ep:              {provider: claude_cli, model: claude-haiku-4-5-20251001}
  rollup_match:    {provider: claude_cli, model: claude-haiku-4-5-20251001}
  ideate_generate: {provider: claude_cli, model: claude-opus-5-5, params: {effort: high}}
  ideate_judge:    {provider: codex_cli, model: gpt-5.6-terra, strict_model: true}   # owner: an older model is enough
  # v1.7 (owner ruling 2026-09-27): Qwen3-Embedding-0.6B, the one allowed local model. Polymath's GPU copy
  # first; the Ollama copy (`ollama pull qwen3-embedding:0.6b`) only when Polymath's isn't ready. One backend
  # per run. `make recalibrate` proposes clone thresholds for it and never changes this file.
  embeddings:      {provider: polymath_embedder, model: Qwen/Qwen3-Embedding-0.6B,
                    fallback: {provider: local, model: "qwen3-embedding:0.6b"}}
  eval_match:      {provider: claude_cli, model: claude-haiku-4-5-20251001}   # PROPOSED (not in the G1a list); AC-17, M3
  prior_art:       {provider: claude_cli, model: claude-sonnet-5}   # v1.6: native web search for absence claims
  census:          {provider: claude_cli, model: claude-sonnet-5}   # v1.6: counts only; Haiku only if the accuracy check passes
# USD per 1M tokens for API-billed "<provider>/<model>" pairs (local models: 0). Subscription CLI
# calls are not priced here: each call's own reported cost is logged as a shadow cost.
pricing:
  "anthropic/claude-opus-5-5":           {input_per_mtok: 4.0, output_per_mtok: 20.0}
  "anthropic/claude-sonnet-5":           {input_per_mtok: 2.0, output_per_mtok: 10.0}
  "anthropic/claude-haiku-4-5-20251001": {input_per_mtok: 1.0, output_per_mtok: 5.0}

# G1a 2026-09-27 (Kingsley): VERIFY searches with the claude CLI's own WebSearch/WebFetch tools, not
# a search API. A citation counts only if that call's tool traffic retrieved the URL.
search: {backend: native}

budget:   # G1a, approved 2026-09-26
  # Subscription CLIs: call caps (the plan limits your coding sessions share). A rate/usage-limit
  # error stops the run cleanly; finished calls stay cached and the rerun resumes from the cache.
  calls_per_run: 40             # confirmed by Kingsley 2026-09-27
  calls_per_title: 6            # confirmed; M2 needs 2 per title (P1 + VERIFY), 4 with repairs
  min_seconds_between_calls: 5
  # API-billed providers only (none in use):
  run_cap_usd: 25
  per_title_cap_usd: 3
  per_episode_cap_usd: 0.25

verify:
  conf_threshold: 0.7
  max_searches_per_title: 3
  outcome_extra_searches: 2
  always_verify: ["core.outcome", "sensory.*", "moments.*.locator"]
  pages_per_search: 2
  queries:                       # {title} {year} {medium_label}
    facts: "{title} {year} {medium_label}"
    episodes: "{title} {medium_label} episode list"
    outcome: ["{title} {year} {medium_label} reception ratings", "{title} {medium_label} review"]
  medium_labels: {anime: anime, donghua: donghua, western_animation: animated series, adult_animation: adult animated series,
                  live_action: TV series, film: film}
p2:
  max_atoms: 15
  max_effect_atoms: 12
  engine_atoms: {min: 1, max: 3}
  low_atom_alarm: 5
p3: {load_bearing_alarm: 8, load_bearing_low_flag: 3}
check: {reject_rate_alarm: 0.30}
coverage: {min_titles_with_module: 5, min_field_completion: 0.8}
episodes:
  selection: [pilot, moment, finale, control]
  max_per_title: 6
  max_moment_episodes: 3
  require_fetched_source: true
  summary_max_words: 60
  max_decisions_per_episode: 2
  match_similarity: 0.85
  promote_threshold: 2
  derive_min_episodes: 3
  contradiction_storm_alarm: 0.30
gates:
  structural_jaccard_reject: 0.70
  procedural_jaccard_reject: 0.75
  premise_cosine_reject: 0.72     # Qwen3-Embedding-0.6B recalibration 2026-09-27 (DECISIONS D-013); was 0.90 on mxbai
  premise_cosine_with_structural: 0.55
census:   # v1.6: counts only; the title list comes from AniList
  batch_size: 10
  donghua: 50
  since: 1995
ideate:
  target_domain: anime
  grid_dims: ["power_combat.gate", "power_combat.cost_of_power", "power_combat.progression"]
  operators: [reverse_incentive, redistribute_knowledge, transfer_cost, change_rule, combine_mechanisms, import_lane,
              revive_execution_flop, borrow_system]   # v1.6: the last two run only with their evidence
  judge_batch: 4
  seed: 7
  h1_min_changed_dimensions: 2
  generations: 3
  candidates_per_generation: 12
  diversity_alarm: {champion_share: 0.40, cell_share: 0.10}
content_guards:           # AC-11 heuristics (quotes, dialogue, framing claims in sensory fields)
  min_quote_words: 3
  framing_terms: [close-up, close up, wide shot, long shot, medium shot, framing, framed, blocking, cut to,
                  jump cut, editing, edit, camera, angle, tracking shot, dolly, zoom, montage, shot composition,
                  storyboard, cinematography, pov shot]
eval:
  gold_key_fields:
    - power_combat.gate
    - power_combat.cost_of_power
    - power_combat.progression
    - power_combat.visible_counter
    - power_combat.fight_medium
    - relationships.power_is
    - core.outcome
  gold_elements: {min: 3, max: 5}
  bars: {p1_enum_agreement: 0.80, p3_load_bearing_agreement: 0.70, load_bearing_recall: 0.60}
data_repo:   # owner ruling 2026-09-27: private backups of data that never goes to the public code repo
  remote: https://github.com/Kingsley-Cyber/animedex-data.git
  clone: ../animedex-data          # local clone, next to the code checkout
  paths: [data/canonical, data/blind, data/diagnose, eval/blind, eval/gold, steering, seeds, studio]   # no cache, no raw run logs
  push_after_batch: true           # once the clone exists (a first `make data-push` creates it)
gather:   # v1.7 GATHER: documented fields it may fill (only those the vocab has count), and its web limits
  max_searches: 4
  max_fetches: 8
  paths: [anime_production.source_medium, anime_production.demographic, anime_production.adaptation_fidelity,
          anime_production.arc_cour_structure, power_combat.power_source, power_combat.gate, power_combat.progression,
          power_combat.cost_of_power, power_combat.cost_of_power_secondary, power_combat.visible_counter,
          power_combat.ranking_ladder, power_combat.fight_medium, power_combat.signature_technique,
          power_combat.power_embodiment, power_combat.set_structure, power_combat.subset_mechanics,
          power_combat.set_scaffold, power_combat.rarity, power_combat.power_up_mode, power_combat.power_up_cost,
          relationships.rival, relationships.mentor, relationships.team_structure, core.world_rules,
          core.ending_type, core.setting_type, core.world_visibility, core.conflict_scale, core.institutions]
