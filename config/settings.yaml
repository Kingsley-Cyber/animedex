# ANIMEDEX settings (light path, 2026-09-27 audit). Secrets go in .env only; none are needed:
# every model call goes through Kingsley's subscriptions via the official CLIs (claude, codex) in headless mode.

providers:
  claude_cli:
    type: claude_cli
    binary: claude
    send_params: [effort]
    timeout_s: 900
  codex_cli:                    # the non-Claude family for the check
    type: codex_cli
    binary: codex
    send_params: [effort]
    timeout_s: 900
  codex_scan:
    type: codex_cli
    binary: codex
    send_params: [effort]
    timeout_s: 900
    allow_web: true
  polymath_embedder:            # Polymath's embedder sidecar (Qwen3-Embedding-0.6B); embeddings only (diagnose)
    type: polymath_embedder
    base_url: http://127.0.0.1:8742
  local:                        # the Ollama copy of the same embedder, used when Polymath's is not ready
    type: openai_compatible
    base_url: http://localhost:11434/v1
    structured_output: json_object
    send_params: [max_tokens, temperature]
  mock:
    type: mock

models:   # concrete ids, not aliases; `strict_model`: any other served model is refused
  scan:     {provider: codex_scan, model: gpt-5.6-terra, strict_model: true}           # live discourse only
  ingest:   {provider: claude_cli, model: claude-sonnet-5, params: {effort: medium}}   # notes, quick research, prior art (web)
  generate: {provider: claude_cli, model: claude-opus-5-5, params: {effort: high}}     # quick cards; diagnose structuring uses ingest
  check:    {provider: codex_cli, model: gpt-5.6-terra, strict_model: true}           # the check of quick cards and of diagnosed concepts
  embeddings: {provider: polymath_embedder, model: Qwen/Qwen3-Embedding-0.6B,
               fallback: {provider: local, model: "qwen3-embedding:0.6b"}}

budget:
  calls_per_run: 40             # a run stops cleanly before the call that would pass this (plan limits are shared)
  min_seconds_between_calls: 5

notes:   # `make ingest` and quick's research write notes/<slug>.json (one Sonnet call per three shows)
  shows_per_call: 3
  searches_per_show: 2          # web limits per call = these x shows in the call
  fetches_per_show: 2

quick:   # `make quick SEED=...`: research (only when needed), generate, check, prior art (only for "never done")
  calls_per_run: 8              # four calls, each with its one repair
  cards: 6
  picks_min: 3
  picks_max: 5
  consequence_min: 2            # a card survives only when at least this many of choices/relationships/outcomes differ

diagnose:   # `make diagnose TEXT=...`: structure the concept as a note (ingest prompt), then the check
  calls_per_run: 4              # two calls, each with its one repair
  max_concept_words: 800
  structural_overlap_fail: 0.70     # tracked-enum Jaccard against a note at or above this: a clone
  premise_similarity_fail: 0.72     # premise cosine at or above this: a clone
  novelty_min_notes: 10             # the enum-pair novelty check needs at least this many notes

data_repo:   # private backups of data that never goes to the public code repo
  remote: https://github.com/Kingsley-Cyber/animedex-data.git
  clone: ../animedex-data          # local clone, next to the code checkout
  paths: [data/canonical, data/blind, data/diagnose, data/backtest, data/commentary, eval/audit, eval/blind, eval/gold,
          steering, seeds, studio, ontology/proposals, notes, build/quick]   # the heavy path's data stays backed up
  push_after_batch: true
