# Competency questions (01, spec v1.2). `requires:` lists the fields each question
# reads: P1 lens paths (core.*, <module>.*) or record paths (<record>.<field>).
# Every lens field, module, vocab field, and bridge concept must trace to >= 1 CQ.
version: 1.9.0
questions:
  # Gap analysis
  - id: CQ-G01
    text: Which gate x cost-of-power combinations have zero titles, given adequate coverage?
    requires: [power_combat.gate, power_combat.cost_of_power, coverage.field_completion, coverage.modules_active]
  - id: CQ-G02
    text: For each empty cell, untried or tried by a mixed/flop title? Was that failure premise-level or execution-level, and what was the recorded reason?
    requires: [power_combat.gate, power_combat.cost_of_power, core.outcome, outcome.label, outcome.failure_reason, outcome.failure_level]
  - id: CQ-G03
    text: Which unserved appetites (and the borrowed templates and broken rules that served them) appear in hits but in only one title's load-bearing atoms?
    requires: [core.unserved_appetite, core.borrowed_template, core.broken_rule, core.outcome, mechanism.atom_kind, proof.ablation.verdict]
  - id: CQ-G04
    text: Which progression types have never been paired with a given fight medium?
    requires: [power_combat.progression, power_combat.fight_medium, coverage.field_completion]
  - id: CQ-G05
    text: Which load-bearing patterns appear in >= 2 non-anime titles and 0 anime titles? (imported lanes)
    requires: [transfer.pattern, transfer.bridge, title.medium, proof.ablation.verdict]
  - id: CQ-G06
    text: Which load-bearing anime patterns never appear in Western media? (export lanes)
    requires: [transfer.pattern, transfer.bridge, title.medium, proof.ablation.verdict]
  - id: CQ-G07
    text: Where is coverage too thin to trust a zero?
    requires: [coverage.field_completion, coverage.modules_active, coverage.verified_share]
  - id: CQ-G08
    text: Which tone x premise-engine combinations are unused in battle anime?
    requires: [core.tone, core.premise_engine, title.modules_active, title.medium]
  - id: CQ-G09
    text: Which source mediums, demographics, and adaptation-fidelity levels cluster among hits vs. flops, with confounders shown?
    requires: [anime_production.source_medium, anime_production.demographic, anime_production.adaptation_fidelity, core.outcome, outcome.confounders.studio, outcome.confounders.budget_signal, outcome.confounders.source_popularity, outcome.confounders.platform, outcome.confounders.release_context]
  # Ideation
  - id: CQ-I01
    text: Which load-bearing transfer atoms share a bridge concept but come from different media?
    requires: [transfer.bridge, title.medium, proof.ablation.verdict]
  - id: CQ-I02
    text: Which pairs of load-bearing atoms both appear in hits but never co-occur?
    requires: [mechanism.atom_id, mechanism.explanation, proof.ablation.verdict, core.outcome]
  - id: CQ-I03
    text: For a chosen theme (core_question), which power gates have never embodied it?
    requires: [core.core_question, power_combat.gate]
  - id: CQ-I04
    text: What is the nearest existing title to a candidate idea, by structural overlap and logline/premise similarity?
    requires: [power_combat.gate, power_combat.cost_of_power, power_combat.progression, power_combat.visible_counter, power_combat.fight_medium, relationships.power_is, core.logline_hook, core.premise_engine, idea.logline, idea.premise]
  - id: CQ-I05
    text: Does a candidate's key combination match a flop's load-bearing combination?
    requires: [idea.profile, proof.ablation.verdict, core.outcome, outcome.failure_reason]
  - id: CQ-I06
    text: Which information-economy patterns (central mystery x knowledge gap x reveal cadence) have never been used with a visible power counter?
    requires: [core.central_mystery, core.knowledge_gap, core.reveal_cadence, power_combat.visible_counter]
  - id: CQ-I07
    text: Which relationship structures (power_is = paired/collective; core bond, rival, mentor, team structure) are unused in battle anime?
    requires: [relationships.power_is, relationships.core_bond, relationships.rival, relationships.mentor, relationships.team_structure, title.modules_active]
  - id: CQ-I08
    text: Which comedic engines from Western/adult animation have never been paired with a power ladder?
    requires: [comedy_satire.comedic_engine, power_combat.ranking_ladder, title.medium]
  - id: CQ-I09
    text: Which film structures (act structure, runtime compression, set pieces, closure) could compress into a single anime arc or cour?
    requires: [film.act_structure, film.runtime_compression, film.set_pieces, film.closure, anime_production.arc_cour_structure]
  - id: CQ-I10
    text: Which character and world structures (want vs. need, flaw and its condition, moral line and its condition, opposition and its logic, stakes/clock, world rules) recur in hits' load-bearing atoms?
    requires: [core.want_vs_need, core.flaw, core.moral_line, core.central_opposition, core.opposition_logic, core.stakes_clock, core.world_rules, proof.ablation.verdict, core.outcome]
  - id: CQ-I11
    text: Which engine atoms from hits (goal, constraint, strategy, cost, dilemma) have never been combined with a given gate or cost of power?
    requires: [mechanism.engine.goal, mechanism.engine.constraint, mechanism.engine.strategy, mechanism.engine.cost, mechanism.engine.dilemma, power_combat.gate, power_combat.cost_of_power, core.outcome]
  - id: CQ-I12
    text: For a transfer pattern, which variable details have only ever taken one value across the corpus?
    requires: [transfer.pattern, transfer.variable_details]
  - id: CQ-I13
    text: Which transformation operators produce champions, and which mostly fail gates?
    requires: [idea.transformation.operator, idea.status, idea.gates]
  - id: CQ-G10
    text: Which power gate x cost-of-power cells are empty across the whole census (catalog-wide), not just the deep corpus?
    requires: [census.gate, census.cost_of_power, census.has_power_system]
  - id: CQ-I15
    text: Which "never done" and lane claims survived the prior-art web check, and which met a counterexample?
    requires: [prior_art.claim_kind, prior_art.verdict, prior_art.subject_id]
  - id: CQ-I14
    text: Which execution-level failures offer a T5 "retold better" lane (a sound premise whose execution failed)?
    requires: [outcome.failure_level, outcome.failure_reason, outcome.failure_evidence, mechanism.atom_kind, proof.ablation.verdict]
  # Episodes and moments
  - id: CQ-E01
    text: Which moment types recur across the most iconic fights, and what mechanism and primary feeling explain each?
    requires: [moment.moment_type, moment.why_it_hit, core.primary_feeling, mechanism.effect.feeling, mechanism.effect.because]
  - id: CQ-E02
    text: Which pilot structures (function, end hook, information shift) precede hits vs. flops? (M6)
    requires: [episode.selection_reason, episode.function, episode.end_hook, episode.info_shift.gap_change, core.outcome]
  - id: CQ-E03
    text: For an iconic fight, what are its power rules, choreography, and visual signature? (fight brief)
    requires: [power_combat.power_source, power_combat.gate, power_combat.cost_of_power, power_combat.signature_technique, sensory.choreography_style, sensory.power_visual_signature, sensory.color_motif, sensory.animation_signature, moment.moment_type]
  - id: CQ-E04
    text: Which series engines (episodic vs. serialized, reset, episode template, cliffhanger cadence, season arc shape) pair with hits in each medium?
    requires: [series_engine.episodic_vs_serialized, series_engine.status_quo_reset, series_engine.episode_template, series_engine.cliffhanger_cadence, series_engine.season_arc_shape, title.medium, title.format, core.outcome]
  - id: CQ-E05
    text: Does each title's engine run in ordinary (control) episodes, or only in highlight episodes? (M6)
    requires: [episode.selection_reason, episode.engine_beat.engine_atom_id, mechanism.atom_kind]
  - id: CQ-E06
    text: How far apart are setups and payoffs, and which setups stay unresolved? (M6)
    requires: [episode.setups, episode.payoffs.setup_episode_id, link.type, title.scope.numbering]
  - id: CQ-E07
    text: Which show-level atoms are episode-backed, mixed, or contradicted? (M6)
    requires: [mechanism.support.status]
  - id: CQ-E08
    text: Which decision shapes (options, rejected alternative, expected vs. actual outcome) recur in hits' key episodes? (M6)
    requires: [episode.decisions.options, episode.decisions.rejected, episode.decisions.expected, episode.decisions.actual, core.outcome]
  # v1.8: concept, character and abstract layers (vocab 1.5.0). The first thirteen are the owner's
  # examples; the rest make sure every new lens field and every new record field has a question.
  - id: CQ-G11
    text: Which mc_edge types appear in hits, and which gate x mc_edge combinations are unused?
    requires: [power_combat.mc_edge, power_combat.gate, core.outcome, outcome.label, coverage.field_completion]
  - id: CQ-I16
    text: Which open_variety systems give the MC a weak medium that gets reinterpreted?
    requires: [power_combat.set_structure, power_combat.mc_edge, core.mc_start, character.role, character.relationship_to_power, character.power_kit.medium, character.power_kit.creativity_level, character.power_kit.creativity_moves]
  - id: CQ-I17
    text: Which closed or hierarchical sets have identity_with_history members, and on what scaffold?
    requires: [power_combat.set_structure, power_combat.member_depth, power_combat.set_scaffold]
  - id: CQ-G12
    text: Which power_kind x creativity_level combinations are unused?
    requires: [character.power_kit.power_kind, character.power_kit.creativity_level]
  - id: CQ-I18
    text: How do stat_block heroes generate drama in hits vs. flops?
    requires: [character.power_kit.power_kind, character.power_kit.drama_source, core.outcome, outcome.label]
  - id: CQ-I19
    text: Which origin-power links recur in hits' load-bearing atoms?
    requires: [character.origin_power_link, mechanism.evidence_refs, proof.ablation.verdict, core.outcome, outcome.label]
  - id: CQ-G13
    text: Which story engines have never been paired with bound-entity powers?
    requires: [core.story_engine, core.story_engine_secondary, power_combat.power_embodiment, character.power_kit.power_kind]
  - id: CQ-G14
    text: Which villain types appear with hidden worlds, and which are unused there?
    requires: [character.villain.villain_type, core.world_visibility]
  - id: CQ-I20
    text: Which core fantasies pair with which story engines in hits?
    requires: [core.core_fantasy, core.story_engine, core.outcome, outcome.label]
  - id: CQ-I21
    text: Which flops broke the promise their premise made, and how?
    requires: [core.audience_promise, core.promise_mechanism, core.promise_break, outcome.failure_patterns, outcome.label]
  - id: CQ-I22
    text: Which escalation models survive 100+ episodes?
    requires: [core.escalation_model, coverage.episodes.in_scope, core.outcome]
  - id: CQ-I23
    text: Which real-world systems have never been used as power systems?
    requires: [core.real_world_isomorphism, census.borrowed_system, census.has_power_system]
  - id: CQ-I24
    text: Which premise abstractions have zero near-neighbors?
    requires: [core.premise_abstraction]
  - id: CQ-G15
    text: Which setting x world-visibility x conflict-scale combinations are unused?
    requires: [core.setting_type, core.world_visibility, core.conflict_scale]
  - id: CQ-G16
    text: Which set structures, story engines, and MC archetypes are empty across the census (catalog-wide)?
    requires: [census.set_structure, census.story_engine, census.mc_archetype, census.has_power_system]
  - id: CQ-G17
    text: Which set structures have never used a given subset mechanic?
    requires: [power_combat.set_structure, power_combat.subset_mechanics]
  - id: CQ-I25
    text: Which primary x secondary costs of power occur together, and in hits or flops?
    requires: [power_combat.cost_of_power, power_combat.cost_of_power_secondary, core.outcome]
  - id: CQ-I26
    text: How is power embodied, how rare is it, and how deeply is it built into the world, in hits vs. flops?
    requires: [power_combat.power_embodiment, power_combat.rarity, power_combat.world_integration, core.outcome]
  - id: CQ-I27
    text: Which power-up modes, and what they cost, pair with which fight logics?
    requires: [power_combat.power_up_mode, power_combat.power_up_cost, power_combat.fight_logic]
  - id: CQ-I28
    text: Which pilot hooks and ending types appear in hits vs. flops?
    requires: [core.pilot_hook_type, core.ending_type, core.outcome]
  - id: CQ-I29
    text: Which institutions (by type and role in the story) drive stories, and in which settings?
    requires: [core.institutions, core.setting_type]
  - id: CQ-I30
    text: Which MC archetype x starting strength x goal combinations appear in hits?
    requires: [core.mc_archetype, core.mc_start, core.mc_goal_type, core.outcome]
  - id: CQ-I31
    text: How do ensemble size, rival type, and threat structure pair in hits vs. flops?
    requires: [core.ensemble_size, core.rival_type, core.threat_structure, core.outcome]
  - id: CQ-I32
    text: What thematic arguments (the MC's thesis, the villain's antithesis, the ending's resolution) do hits make?
    requires: [core.thematic_argument, core.outcome]
  - id: CQ-I33
    text: Which anticipation-hook types keep hits going?
    requires: [core.anticipation_hooks, core.outcome]
  - id: CQ-I34
    text: Which genre moves, reacting against what, appear in hits vs. flops?
    requires: [core.genre_move, core.reacts_against, core.outcome]
  - id: CQ-I35
    text: Which failure patterns recur among mixed and flop titles, and what sources back them?
    requires: [outcome.failure_patterns, outcome.label, outcome.failure_level]
  - id: CQ-I36
    text: Which mechanisms, principles, and anti-patterns do load-bearing transfers carry, by bridge concept?
    requires: [transfer.mechanism, transfer.principle, transfer.anti_pattern, transfer.bridge, proof.ablation.verdict]
  - id: CQ-I37
    text: Which pattern-card principles are predictive, and on which held-out titles? (M7)
    requires: [pattern.predictive, pattern.predictive_evidence, pattern.supporting_titles]
  - id: CQ-I38
    text: Which MC edges, power kits, escalation models, and core fantasies do idea cards use, and how many carry a thematic argument, audience promise, and premise abstraction?
    requires: [idea.mc, idea.power_kit, idea.thematic_argument, idea.audience_promise, idea.escalation_model, idea.core_fantasy, idea.premise_abstraction, idea.status]
  - id: CQ-I39
    text: Which steering rules do idea cards satisfy or fail, by status?
    requires: [idea.rules, idea.status]
  # Characters (v1.8)
  - id: CQ-C01
    text: What wants, needs, flaws, moral lines, and arc types does each cast role carry, and when is its backstory revealed?
    requires: [character.role, character.want, character.need, character.flaw, character.moral_line, character.arc_type, character.backstory_reveal]
  - id: CQ-C02
    text: Where do each role's turning points fall across the run?
    requires: [character.turning_points, character.role]
  - id: CQ-C03
    text: How do protagonists' origins and wounds tie to their power kits (functions, signature tools, limits, forms), and how do the kits grow?
    requires: [character.origin, character.wound, character.origin_power_link, character.relationship_to_power, character.power_kit.functions, character.power_kit.tools, character.power_kit.limits, character.power_kit.forms, character.power_kit.evolution, power_combat.mc_edge]
  - id: CQ-C04
    text: Which villain reveals and relations to the MC pair with which villain types, in hits vs. flops?
    requires: [character.villain.villain_type, character.villain.villain_reveal, character.villain.relation_to_mc, core.outcome]
  # Print media (v1.9, owner instruction 2026-09-27)
  - id: CQ-P01
    text: Which popular print titles (manga, manhwa, webtoon, light novel) in each story-engine lane have no screen adaptation?
    requires: [census.medium, census.adaptation, census.story_engine, census.popularity]

  # Light path (owner instruction 2026-09-27, D-055): counts from the notes index
  - id: CQ-N01
    text: Which story-engine lanes does the notes index cover, and with what outcomes?
    requires: [notes.story_engine, notes.outcome]
  - id: CQ-N02
    text: Which gate x cost-of-power pairs does no note hold (gaps in the index), ranked by expected count?
    requires: [notes.gate, notes.cost_of_power]
  - id: CQ-N03
    text: Which progression x visible-counter pairs does no note hold, ranked by expected count?
    requires: [notes.progression, notes.visible_counter]
  - id: CQ-N04
    text: Which set-structure x power-is pairs does no note hold?
    requires: [notes.slug]
  - id: CQ-N05
    text: What does the notes index cover, by medium and outcome?
    requires: [notes.medium, notes.outcome]

