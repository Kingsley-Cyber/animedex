[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animedex"
version = "0.1.0"
description = "ANIMEDEX: evidence-backed ideation engine for screen stories"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kingsley" }]
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "anthropic>=1.0",
    "mcp>=1.10",
]

[project.scripts]
animedex = "animedex.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/animedex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast deterministic unit tests",
    "contract: schema, invariant, store, and determinism contract tests",
    "pipeline: offline stage tests on the mock provider",
    "integration: contract + pipeline tests (URCP validator alias)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
